name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "pyproject.toml"

jobs:
  validate-and-build:
    name: Validate & Package Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test & CLI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install comfy-cli

      - name: Compile, test, validate & build archive
        run: |
          python -m py_compile zero_copy_cuda.py __init__.py
          python -m unittest discover -s tests -v
          comfy node validate
          comfy node pack

      - name: Upload built node archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-zerocopy-continuity-node
          path: node.zip

  publish:
    name: Publish to Comfy Registry
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
