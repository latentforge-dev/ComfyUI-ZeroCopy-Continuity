[project]
name = "comfyui-zerocopy-continuity"
version = "1.1.0"
requires-python = ">=3.10"
description = "Permanent VRAM Pinning & Lossless Latent Continuity Chaining for Multi-Shot DiT Pipelines on NVIDIA GPUs"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Antigravity & LatentForge Team", email = "dev@latentforge.dev" }
]
keywords = [
    "comfyui",
    "cuda",
    "vram",
    "zerocopy",
    "dit",
    "minimax-h3",
    "wan2.1",
    "hunyuan-video",
    "latent-continuity",
    "blackwell",
    "rtx5090"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.1.0",
]

[project.urls]
Repository = "https://github.com/latentforge-dev/ComfyUI-ZeroCopy-Continuity"
Homepage = "https://latentforge.dev"

[tool.comfy]
PublisherId = "latentforge-dev"
DisplayName = "CUDA Zero-Copy GPU Pinning & Latent Continuity"
Icon = "https://latentforge.dev/assets/zerocopy-icon.png"
